<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>BLE Beacon Cloner</title>
<style>
:root{
  --bg:#0f1115;--card:#181b22;--card2:#1b2029;--line:#262b36;--fg:#e8ebf1;--dim:#9aa3b6;
  --acc:#4c8dff;--ok:#37c98b;--warn:#f0b429;--err:#f2555a;
  --r:12px;--pad:14px
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:24px}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:600;margin-right:auto}
.pill{padding:3px 9px;border-radius:99px;font-size:11px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.on{color:var(--ok);border-color:#1e5a44;background:#0f2a22}
.pill.off{color:var(--dim)}
.pill.err{color:var(--err);border-color:#5a1e22;background:#2a0f11}
select,input,button{font:inherit;color:var(--fg)}
select,input[type=text],input[type=password],input[type=number]{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:38px;width:100%}
input:focus,select:focus{outline:1px solid var(--acc);border-color:var(--acc)}
header select{width:auto;min-height:0;padding:4px 8px;border-radius:99px;font-size:12px;background:#151a22}

/* tabs */
nav{display:flex;gap:6px;padding:10px 12px 0;max-width:900px;margin:0 auto}
nav button{flex:1;background:#151a22;border:1px solid var(--line);color:var(--dim);padding:10px 8px;border-radius:10px;font-size:14px;cursor:pointer}
nav button.active{color:#fff;background:#233044;border-color:#31425c;font-weight:600}
main{padding:12px;max-width:900px;margin:0 auto}
section{display:none}
section.active{display:block}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:12px}
.card>h2{font-size:11px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.card>h2 .sp{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400}

/* segmented control (mode switch, sub tabs) */
.seg{display:flex;gap:6px;background:#12161d;border:1px solid var(--line);border-radius:12px;padding:5px}
.seg button{flex:1;border:0;background:transparent;color:var(--dim);padding:11px 6px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;transition:background .12s,color .12s}
.seg button.on{background:#233044;color:#fff}
.seg button.on.sniff{background:#173044;color:#8ec5ff}
.seg button.on.clone{background:#12301f;color:#7ce8b3}
.seg button:disabled{opacity:.5;cursor:default}

/* progress */
.bar{height:6px;border-radius:99px;background:#12161d;overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s linear}
.bar.clone>i{background:var(--ok)}

/* key/value rows */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin-top:10px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.hint{font-size:12px;color:var(--dim);margin-top:8px}

/* buttons */
.btn{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#31425c}
.btn.pri{background:#233044;border-color:#31425c;color:#fff;font-weight:600}
.btn.ok{color:var(--ok);border-color:#1e5a44}
.btn.bad{color:var(--err);border-color:#5a1e22}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* toolbar: chips + search + sort */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{background:#151a22;border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:7px 12px;font-size:12px;cursor:pointer}
.chip.on{color:#fff;background:#233044;border-color:#31425c;font-weight:600}
.tools input[type=text]{flex:1;min-width:130px}
.tools select{width:auto;min-width:120px}

/* record cards */
.rec{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden}
.rec>.h{display:flex;gap:9px;align-items:center;padding:9px 11px;cursor:pointer}
.rec>.h:active{background:var(--card2)}
.rssi{flex:0 0 auto;min-width:42px;text-align:center;border-radius:7px;padding:3px 5px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;background:#12161d;border:1px solid var(--line);color:var(--dim)}
.rssi.good{color:#7ce8b3;border-color:#1e5a44;background:#0f2a22}
.rssi.mid{color:var(--warn);border-color:#4a3a12;background:#241d0c}
.rec .t{flex:1;min-width:0}
.rec .n{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .s{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim);background:#12161d;vertical-align:middle;white-space:nowrap}
.tag.hi{color:#8ec5ff;border-color:#1d3350}
.tag.ding{color:#7ce8b3;border-color:#1e5a44;background:#0f2a22}
.tag.pub{color:var(--acc);border-color:#243a5c}
.rec .x{margin-left:auto;font-size:11px;color:var(--dim);text-align:right;white-space:nowrap}
.rec>.b{display:none;border-top:1px solid var(--line);padding:11px;background:#151a22}
.rec.open>.b{display:block}
.hex{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.6;color:#cdd5e4;word-break:break-all;background:#12161d;border:1px solid var(--line);border-radius:8px;padding:8px;margin:4px 0}
.copy{font-size:11px;color:var(--acc);background:none;border:0;padding:0 0 0 8px;cursor:pointer}

/* dialog */
#dlg{position:fixed;inset:0;background:rgba(6,8,11,.72);display:none;align-items:flex-start;justify-content:center;z-index:30;overflow:auto;padding:16px}
#dlg.show{display:flex}
#dlg .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:520px;margin:auto}
#dlg h3{margin:0 0 12px;font-size:15px}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.field .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0}
.chk input{width:auto;min-height:0}

/* log */
#log-list{max-height:320px;overflow:auto;font-size:12px}
.logrow{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #1e232c}
.logrow:last-child{border-bottom:0}
.logrow .tm{color:var(--dim);flex:0 0 auto;font-variant-numeric:tabular-nums}
.logrow .ty{flex:0 0 auto;color:var(--acc)}
.logrow .tx{flex:1;word-break:break-word}

/* login / toast */
#login{position:fixed;inset:0;background:rgba(6,8,11,.9);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
#login .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
#login h3{margin:0;font-size:15px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#233044;border:1px solid #31425c;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#3a1418;border-color:#5a1e22}
.dim{color:var(--dim)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.empty{color:var(--dim);font-size:13px;padding:18px 4px;text-align:center}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<header>
  <h1>BLE Beacon Cloner</h1>
  <span id="p-mode" class="pill off">—</span>
  <span id="p-adv" class="pill off">—</span>
  <span id="p-sta" class="pill">—</span>
  <select id="lang" title="Language"><option value="en">EN</option><option value="zh">中文</option></select>
  <button class="btn sm" id="btn-lock" title="Lock">🔒</button>
</header>

<nav>
  <button data-tab="status" class="active" data-i18n="nav_status">Status</button>
  <button data-tab="data" data-i18n="nav_data">Data</button>
  <button data-tab="settings" data-i18n="nav_settings">Settings</button>
</nav>

<main>
<!-- ================= STATUS ================= -->
<section id="tab-status" class="active">
  <div class="card">
    <h2 data-i18n="mode_title">Mode</h2>
    <div class="seg" id="mode-seg">
      <button data-mode="idle" data-i18n="mode_idle">Idle</button>
      <button data-mode="sniff" data-i18n="mode_sniff">Sniff</button>
      <button data-mode="clone" data-i18n="mode_clone">Broadcast</button>
    </div>
    <div id="mode-panel"></div>
  </div>

  <div class="card">
    <h2 data-i18n="st_runtime">Runtime</h2>
    <dl class="kv" id="runtime"></dl>
  </div>

  <div class="card" id="pow-card" style="display:none;border-color:#5a1e22">
    <h2 style="color:var(--err)" data-i18n="st_power">Power</h2>
    <div id="pow-warn" class="dim"></div>
  </div>

  <div class="card">
    <h2><span data-i18n="st_events">Recent events</span>
      <span class="sp row">
        <button class="btn sm" id="log-toggle" data-i18n="show">Show</button>
        <button class="btn sm" id="log-refresh" data-i18n="refresh">Refresh</button>
        <button class="btn sm bad" id="log-clear" data-i18n="clear">Clear</button>
      </span>
    </h2>
    <div id="log-list" style="display:none"></div>
  </div>
</section>

<!-- ================= DATA ================= -->
<section id="tab-data">
  <div class="seg" id="sub-seg" style="margin-bottom:12px">
    <button data-sub="archive" class="on" data-i18n="sub_archive">Archive</button>
    <button data-sub="pins" data-i18n="sub_pins">Favourites</button>
    <button data-sub="profiles" data-i18n="sub_profiles">Profiles</button>
  </div>

  <div class="tools" id="tools">
    <button class="chip" data-filter="ding" data-i18n="f_ding">DingTalk</button>
    <button class="chip" data-filter="pub" data-i18n="f_pub">Public addr</button>
    <button class="chip" data-filter="full" data-i18n="f_full">Full window</button>
    <input type="text" id="kw" placeholder="search name / addr / vendor">
    <select id="sort">
      <option value="time" data-i18n="sort_time">Newest</option>
      <option value="rssi" data-i18n="sort_rssi">RSSI</option>
      <option value="pkt" data-i18n="sort_pkt">Packets</option>
      <option value="name" data-i18n="sort_name">Name</option>
    </select>
    <button class="btn sm" id="btn-refresh" data-i18n="refresh">Refresh</button>
    <button class="btn sm pri" id="btn-new" style="display:none" data-i18n="new">New</button>
  </div>

  <div id="list"></div>
</section>

<!-- ================= SETTINGS ================= -->
<section id="tab-settings">
  <div class="card">
    <h2 data-i18n="set_scan">Scan parameters</h2>
    <div class="field"><label data-i18n="set_itvl">Interval (ms)</label><input type="number" id="s-itvl" min="20" max="10240"></div>
    <div class="field"><label data-i18n="set_win">Window (ms)</label><input type="number" id="s-win" min="2" max="10240"></div>
    <div class="field"><label data-i18n="set_dur">Capture window (s)</label><input type="number" id="s-dur" min="10" max="900"></div>
    <label class="chk"><input type="checkbox" id="s-duty"> <span data-i18n="set_duty">Full duty when no client is connected</span></label>
    <label class="chk"><input type="checkbox" id="s-filter"> <span data-i18n="set_filter">Drop phones, watches, earbuds, Windows PCs</span></label>
    <label class="chk"><input type="checkbox" id="s-clear"> <span data-i18n="set_clear">Clear the table each window</span></label>
    <div class="row" style="margin-top:10px"><button class="btn pri" id="save-scan" data-i18n="save">Save</button></div>
  </div>

  <div class="card">
    <h2 data-i18n="set_ap">SoftAP</h2>
    <div class="field"><label data-i18n="set_ssid">SSID</label><input type="text" id="s-ssid" maxlength="31"></div>
    <div class="field"><label data-i18n="set_pass">Password (8+)</label><input type="text" id="s-pass" maxlength="63"></div>
    <div class="row"><button class="btn pri" id="save-ap" data-i18n="save">Save</button><span class="dim" style="font-size:12px" data-i18n="set_ap_hint">Takes effect after a reboot</span></div>
  </div>

  <div class="card">
    <h2 data-i18n="set_rot">Rotation</h2>
    <label class="chk"><input type="checkbox" id="s-rot-on"> <span data-i18n="set_rot_on">Rotate through the enabled profiles</span></label>
    <div class="field"><label data-i18n="set_rot_s">Seconds per profile</label><input type="number" id="s-rot-s" min="5" max="3600"></div>
    <div class="row"><button class="btn pri" id="save-rot" data-i18n="save">Save</button></div>
  </div>

  <div class="card">
    <h2 data-i18n="set_io">Import / export</h2>
    <div class="row">
      <button class="btn" id="btn-export" data-i18n="set_export">Export config</button>
      <button class="btn" id="btn-import" data-i18n="set_import">Import config</button>
      <input type="file" id="file-import" accept=".json,application/json" style="display:none">
    </div>
    <div class="hint" data-i18n="set_io_hint">The export contains profiles, scan settings and the AP credentials.</div>
  </div>

  <div class="card">
    <h2 data-i18n="set_maint">Maintenance</h2>
    <dl class="kv" id="maint-kv"></dl>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="btn-reboot" data-i18n="set_reboot">Reboot</button>
      <button class="btn bad" id="btn-factory" data-i18n="set_factory">Factory reset</button>
    </div>
  </div>
</section>
</main>

<div id="dlg">
  <div class="box">
    <h3 id="dlg-title">Profile</h3>
    <div class="field"><label data-i18n="d_name">Name</label><input type="text" id="d-name" maxlength="23"></div>
    <div class="field"><label data-i18n="d_kind">Kind</label>
      <div class="seg" id="d-kind">
        <button data-kind="1" class="on" data-i18n="d_raw">Raw bytes</button>
        <button data-kind="0" data-i18n="d_ibeacon">iBeacon</button>
      </div>
    </div>
    <div id="d-rawbox">
      <div class="field"><label data-i18n="d_raw">Raw bytes</label><input type="text" id="d-raw" class="mono" placeholder="0201…"></div>
      <div class="field"><label data-i18n="d_rsp">Scan response (optional)</label><input type="text" id="d-rsp" class="mono"></div>
    </div>
    <div id="d-ibox" style="display:none">
      <div class="field"><label data-i18n="d_uuid">UUID</label><input type="text" id="d-uuid" class="mono" placeholder="32 hex chars"></div>
      <div class="field two">
        <div><label data-i18n="d_major">Major</label><input type="number" id="d-major" min="0" max="65535"></div>
        <div><label data-i18n="d_minor">Minor</label><input type="number" id="d-minor" min="0" max="65535"></div>
      </div>
      <div class="field"><label data-i18n="d_ref">Reference RSSI</label><input type="number" id="d-ref" min="-100" max="0"></div>
    </div>
    <div class="field two">
      <div><label data-i18n="d_itvl">Interval (ms)</label><input type="number" id="d-itvl" min="20" max="10240"></div>
      <div><label data-i18n="d_tx">TX (dBm)</label><input type="number" id="d-tx" min="-12" max="21"></div>
    </div>
    <label class="chk"><input type="checkbox" id="d-scannable"> <span data-i18n="d_scannable">Answer scan requests</span></label>
    <label class="chk"><input type="checkbox" id="d-enabled"> <span data-i18n="d_enabled">Enabled</span></label>
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      <button class="btn" id="d-cancel" data-i18n="cancel">Cancel</button>
      <button class="btn pri" id="d-save" data-i18n="save">Save</button>
    </div>
  </div>
</div>

<div id="login">
  <div class="box">
    <h3>BLE Beacon Cloner</h3>
    <input type="password" id="l-pass" placeholder="AP password or token" autocomplete="current-password">
    <button class="btn pri" id="l-btn" data-i18n="unlock">Unlock</button>
    <div id="l-msg" class="dim" style="font-size:12px;color:var(--err)"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ------------------------------------------------------------------ i18n */
const T = {
  nav_status:["Status","状态"], nav_data:["Data","数据"], nav_settings:["Settings","设置"],
  mode_title:["Mode","工作模式"], mode_idle:["Idle","闲置"], mode_sniff:["Sniff","盲扫"], mode_clone:["Broadcast","广播"],
  st_runtime:["Runtime","运行状态"], st_power:["Power","电源"], st_events:["Recent events","最近事件"],
  show:["Show","展开"], hide:["Hide","收起"], refresh:["Refresh","刷新"], clear:["Clear","清空"],
  sub_archive:["Archive","归档"], sub_pins:["Favourites","收藏"], sub_profiles:["Profiles","配置"],
  f_ding:["DingTalk","只看钉钉"], f_pub:["Public addr","只看公网"], f_full:["Full window","只看整窗在线"],
  sort_time:["Newest","最新"], sort_rssi:["RSSI","信号"], sort_pkt:["Packets","包数"], sort_name:["Name","名称"],
  new:["New","新建"], save:["Save","保存"], cancel:["Cancel","取消"], unlock:["Unlock","解锁"],
  search_ph:["search name / addr / vendor","搜索 名称/地址/厂商"],
  idle_hint:["Double-click BOOT to scan, single click to broadcast.","双击 BOOT 盲扫，单击开始广播。"],
  sniff_hint:["One window, archived to flash when it ends. The LED blinks fast.","单次窗口，结束后自动落盘。LED 快闪。"],
  clone_hint:["Broadcasting the active profile. The LED blinks at 1 Hz.","正在广播活动配置。LED 1 Hz 慢闪。"],
  k_packets:["packets","收包"], k_filtered:["filtered","过滤"], k_devices:["devices","设备"],
  k_left:["left","剩余"], k_progress:["progress","进度"],
  k_profile:["Profile","配置"], k_len:["Length","长度"], k_itvl:["Interval","间隔"], k_tx:["TX","发射"],
  k_starts:["Starts","启动次数"], k_rotation:["Rotation","轮播"],
  r_board:["Board","板子"], r_ver:["Firmware","固件"], r_uptime:["Uptime","运行"], r_ip:["IP","IP"],
  r_mac:["MAC","MAC"], r_heap:["Free heap","可用堆"], r_minheap:["Min heap","历史最低"],
  r_boots:["Boots","启动次数"], r_reset:["Reset","复位原因"], r_archive:["Archive","归档"],
  r_clients:["Clients","客户端"], r_led:["LED","LED"], r_mode:["Mode","模式"],
  led_sniff:["scanning","扫描中"], led_clone:["broadcasting","广播中"], led_idle:["idle","空闲"],
  led_clone_client:["broadcast + client","广播且客户端在线"],
  pow_warn:["brownout resets recorded — check the power supply","检测到掉压复位，检查供电"],
  act_pin:["Favourite","收藏"], act_unpin:["Remove","取消收藏"], act_activate:["Activate","激活"],
  act_edit:["Edit","编辑"], act_delete:["Delete","删除"], copy:["copy","复制"], copied:["Copied","已复制"],
  unnamed:["(no name)","(未命名)"], pkt:["pkt","包"], active:["active","使用中"], off:["off","已停用"],
  kind_raw:["RAW","原始字节"], kind_ib:["iBeacon","iBeacon"],
  empty_archive:["Archive is empty. Start a scan, or check that the archive is mounted.","归档为空。先扫一轮，或检查归档分区是否挂载。"],
  empty_pins:["No favourites yet. Expand an archive row and tap Favourite.","还没有收藏。展开归档条目点“收藏”。"],
  empty_profiles:["No profiles. Tap New to build one.","没有配置。点“新建”。"],
  confirm_del:["Delete this profile?","确定删除这条配置？"],
  confirm_factory:["Erase all profiles, favourites and the archive?","清空所有配置、收藏和归档？"],
  dlg_new:["New profile","新建配置"], dlg_edit:["Edit profile","编辑配置"],

/* ------------------------------------------------------------------ net */
function toast(msg, isErr) {
  const el = $("toast");
  el.textContent = msg;
  el.className = "show" + (isErr ? " err" : "");
  clearTimeout(el._h);
  el._h = setTimeout(() => { el.className = ""; }, 2600);
}
async function api(path, opts) {
  opts = opts || {};
  const h = { "Content-Type": "application/json" };
  if (token) h["Authorization"] = "Bearer " + token;
  let r;
  try {
    r = await fetch(path, { method: opts.method || "GET", headers: h,
      body: opts.body === undefined ? undefined : JSON.stringify(opts.body) });
  } catch (e) { toast(t("err_net") + e.message, true); throw e; }
  if (r.status === 401) { showLogin(); throw new Error("unauthorized"); }
  const txt = await r.text();
  let j = {};
  try { j = txt ? JSON.parse(txt) : {}; } catch (e) { j = { ok: r.ok }; }
  if (!r.ok && j.ok !== false) j.err = "HTTP " + r.status;
  return j;
}
const get = p => api(p);
const post = (p, b) => api(p, { method: "POST", body: b || {} });
const put = (p, b) => api(p, { method: "PUT", body: b || {} });
const del = p => api(p, { method: "DELETE" });
const guard = async fn => { try { await fn(); } catch (e) { if (e.message !== "unauthorized") toast(String(e.message || e), true); } };

/* ------------------------------------------------------------------ format */
function fmtDur(s) {
  s = Math.floor(s || 0);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return (h ? h + "h " : "") + (m ? m + "m " : "") + ss + "s";
}
function fmtAddr(a) { return (!a || a.length < 12) ? (a || "") : [0,2,4,6,8,10].map(i => a.slice(i, i + 2)).join(":"); }
function fmtUuid(u) { return (!u || u.length !== 32) ? (u || "") : u.slice(0,8)+"-"+u.slice(8,12)+"-"+u.slice(12,16)+"-"+u.slice(16,20)+"-"+u.slice(20); }
function hexPairs(h) { return h ? h.match(/.{1,2}/g).join(" ") : ""; }
function shortAddr(a) { return (!a || a.length < 12) ? (a || "") : a.slice(0, 2) + ":" + a.slice(10); }

/* first 0xFF AD structure of a raw blob, for rows the firmware did not parse */
function adMfg(hex) {
  if (!hex || hex.length < 6) return null;
  const b = [];
  for (let i = 0; i + 1 < hex.length; i += 2) b.push(parseInt(hex.substr(i, 2), 16));
  let i = 0;
  while (i + 1 < b.length) {
    const l = b[i];
    if (l === 0 || i + 1 + l > b.length) break;
    if (b[i + 1] === 0xFF && l >= 3) {
      let p = "";
      for (let k = i + 4; k < i + 1 + l; k++) p += b[k].toString(16).padStart(2, "0");
      return { company: b[i + 2] | (b[i + 3] << 8), payload: p };
    }
    i += l + 1;
  }
  return null;
}
const CO = { 0x004C:"Apple", 0x0006:"Microsoft", 0x0075:"Samsung", 0x0059:"Nordic", 0x00E0:"Google",
             0x027D:"Huawei", 0x0157:"Huami", 0x0499:"Ruuvi" };
const companyName = id => CO[id] || ("0x" + Number(id).toString(16).toUpperCase().padStart(4, "0"));

/* one badge per record: what kind of thing is this */
function typeTag(d) {
  if (d.ibeacon) return { txt: "iBeacon", cls: "hi" };
  const svc = d.svc || "";
  const cid = (d.mfg_company !== undefined) ? d.mfg_company
            : (adMfg(d.raw) || adMfg(d.rsp) || {}).company;
  if (svc === "0xFE3C" || cid === 0x0100) return { txt: "DingTalk", cls: "ding" };
  if (d.name_vendor) return { txt: d.name_vendor, cls: "" };
  if (d.svc_name && d.svc_name !== d.svc) return { txt: d.svc_name, cls: "" };
  if (svc) return { txt: svc, cls: "" };
  return { txt: "BLE", cls: "" };
}
function vendorOf(d) {
  if (d.mfg_vendor) return d.mfg_vendor;
  const cid = (d.mfg_company !== undefined) ? d.mfg_company : (adMfg(d.raw) || adMfg(d.rsp) || {}).company;
  return (cid === undefined || cid === null) ? "" : companyName(cid);
}
const rssiCls = r => r >= -60 ? "good" : (r >= -80 ? "mid" : "");
const modeTxt = m => t(m === "sniff" ? "mode_sniff" : m === "clone" ? "mode_clone" : "mode_idle");

/* ------------------------------------------------------------------ auth */
function showLogin() { $("login").style.display = "flex"; $("l-pass").focus(); }

function renderStatus() {
  const m = S.mode || "idle";
  document.querySelectorAll("#mode-seg button").forEach(b => {
    b.classList.toggle("on", b.dataset.mode === m);
    b.classList.toggle("sniff", b.dataset.mode === "sniff");

  });
  $("p-mode").textContent = modeTxt(m);

  $("p-adv").textContent = S.adv ? "adv on" : "adv off";
  $("p-adv").className = "pill " + (S.adv ? "on" : "off");
  $("p-sta").textContent = "sta " + (S.sta || 0);
  $("p-sta").className = "pill " + ((S.sta || 0) > 0 ? "on" : "");

  /* mode-specific panel */
  let h = "";
  if (m === "sniff") {
    const dur = Math.max(1, S.scan_duration_s || 120);
    const ran = Math.min(dur, Math.round((S.scan_running_ms || 0) / 1000));
    const pct = Math.min(100, Math.round(ran * 100 / dur));
    const pps = ran > 0 ? Math.round((S.scan_pkts || 0) / ran) : 0;
    h += '<div class="bar sniff"><i style="width:' + pct + '%"></i></div>' +
      '<div class="stats">' +
      stat(ran + "/" + dur + "s", t("k_left")) +

  } else if (m === "clone") {
    const p = (profiles.length && S.active >= 0) ? profiles.find(x => x.id === S.active) : null;
    h += '<div class="stats">' +
      stat(p ? esc(p.name) : ("#" + (S.active >= 0 ? S.active : "-")), t("k_profile")) +
      stat(p ? (p.kind === 1 ? (p.raw || "").length / 2 + " B" : "iBeacon") : "—", t("k_len")) +
      stat(p ? p.adv_itvl_ms + " ms" : "—", t("k_itvl")) +
      stat(p ? p.radio_dbm + " dBm" : "—", t("k_tx")) +
      stat(S.adv_starts || 0, t("k_starts")) +
      '</div>' +
      (S.rotation ? '<div class="hint">' + esc(t("k_rotation")) + ": " + S.rotation_s + "s</div>" : "") +
      '<div class="hint">' + esc(t("clone_hint")) + "</div>";
  } else {
    h += '<div class="hint">' + esc(t("idle_hint")) + "</div>";
  }
  $("mode-panel").innerHTML = h;

  /* runtime */
  const ledKey = "led_" + (S.led || "idle").replace("+", "_").replace("-", "_");
  const rows = [
    [t("r_board"), esc(S.board || "—")],
    [t("r_ver"), esc(S.ver || "—")],
    [t("r_uptime"), esc(fmtDur(S.uptime_s))],
    [t("r_ip"), '<span class="mono">' + esc(S.ip || "—") + "</span>"],
    [t("r_archive"), esc(S.storage || "—")],
    [t("r_clients"), esc(S.sta || 0)],
    [t("r_led"), esc(t(ledKey) === ledKey ? (S.led || "—") : t(ledKey))],
    [t("r_heap"), esc((S.heap || 0) + " / " + (S.min_heap || 0) + " B")],
    [t("r_boots"), esc((S.boots || 0) + " · " + (S.reset_reason || ""))]
  ];
  $("runtime").innerHTML = rows.map(r => "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>").join("");

  const bad = (S.brownouts || 0) > 0;
  $("pow-card").style.display = bad ? "" : "none";

}
const stat = (v, k) => '<div class="stat"><b>' + v + "</b><span>" + esc(k) + "</span></div>";

async function setMode(mode) {
  document.querySelectorAll("#mode-seg button").forEach(b => { b.disabled = true; });
  try {
    const r = await post("/api/mode", { mode });
    if (!r.ok) toast(r.err || t("err_failed"), true);
    else toast(t("mode_set") + modeTxt(r.mode));
    if (mode === "clone" && !profiles.length) await loadProfiles();
  } finally {
    document.querySelectorAll("#mode-seg button").forEach(b => { b.disabled = false; });
    refreshStatus();
  }

async function loadLog() {

/* /api/profiles returns the whole config (profiles + scan + ap + rotation); keep it in CFG

let CFG = {};
async function loadProfiles() {
  let j; try { j = await get("/api/profiles"); } catch (e) { return; }

  CFG = j;
  profiles = (j.profiles || []).map(p => Object.assign({}, p, { active: p.id === j.active }));

function visibleRecs(src) {
  const kw = ui.kw.trim().toLowerCase();
  const fullMin = Math.max(10, Math.round((S.scan_duration_s || 120) / 2));
  let out = src.filter(d => {
    if (ui.fDing && typeTag(d).txt !== "DingTalk") return false;
    if (ui.fPub && d.addr_type !== 0) return false;
    if (ui.fFull && (d.packets || 0) < fullMin) return false;
    if (kw) {
      const hay = [d.name, d.addr, vendorOf(d), d.svc, d.svc_name, fmtAddr(d.addr)].join(" ").toLowerCase();
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
  if (ui.sort === "rssi") out = out.slice().sort((a, b) => (b.rssi || -127) - (a.rssi || -127));
  else if (ui.sort === "pkt") out = out.slice().sort((a, b) => (b.packets || 0) - (a.packets || 0));
  else if (ui.sort === "name") out = out.slice().sort((a, b) =>
    String(a.name || vendorOf(a) || a.addr).localeCompare(String(b.name || vendorOf(b) || b.addr)));
  return out;
}

function renderList() {
  const box = $("list");
  if (ui.sub === "profiles") { box.innerHTML = ""; renderProfiles(box); return; }
  const src = ui.sub === "pins" ? pins : archive;
  const list = visibleRecs(src);
  box.innerHTML = "";
  if (!list.length) {
    box.innerHTML = '<div class="empty">' + esc(t(ui.sub === "pins" ? "empty_pins" : "empty_archive")) + "</div>";
    return;
  }
  list.forEach((d, i) => box.appendChild(recCard(d, ui.sub, i)));
}

function recCard(d, kind, i) {
  const key = kind + ":" + (d.addr || i) + ":" + (d.rssi || 0) + ":" + (d.packets || 0);
  const tg = typeTag(d);
  const vd = vendorOf(d);
  const el = document.createElement("div");
  el.className = "rec" + (expanded.has(key) ? " open" : "");
  const name = d.name ? esc(d.name) : esc(t("unnamed"));
  const sub = [vd, shortAddr(d.addr), (d.packets || 0) + " " + t("pkt")].filter(Boolean).join(" · ");
  el.innerHTML =
    '<div class="h"><span class="rssi ' + rssiCls(d.rssi || -127) + '">' + (d.rssi || "—") + "</span>" +
    '<div class="t"><div class="n">' + name + ' <span class="tag ' + tg.cls + '">' + esc(tg.txt) + "</span></div>" +
    '<div class="s mono">' + esc(sub) + "</div></div>" +
    '<div class="x">' + (expanded.has(key) ? "▾" : "▸") + "</div></div>" +
    '<div class="b">' + recBody(d, kind, i) + "</div>";
  el.querySelector(".h").onclick = () => {
    if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
    el.classList.toggle("open");
    el.querySelector(".x").textContent = el.classList.contains("open") ? "▾" : "▸";
  };
  el.querySelectorAll("[data-copy]").forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      navigator.clipboard && navigator.clipboard.writeText(b.dataset.copy);
      toast(t("copied"));
    };
  });
  el.querySelectorAll("[data-act]").forEach(b => {
    b.onclick = ev => { ev.stopPropagation(); guard(() => recAction(b.dataset.act, d, i)); };
  });
  return el;
}

function recBody(d, kind, i) {
  const tg = typeTag(d);
  const kv = [
    ["addr", '<span class="mono">' + esc(fmtAddr(d.addr)) + "</span>"],
    ["addr_type", (d.addr_type === 0 ? "public" : "random")],
    ["adv_type", "0x" + Number(d.adv_type || 0).toString(16).padStart(2, "0")],
    ["type", esc(tg.txt)],
    ["vendor", esc(vendorOf(d) || "—")],
    ["svc", esc((d.svc_name && d.svc_name !== d.svc) ? d.svc_name + " ( " + d.svc + " )" : (d.svc || "—"))],
    ["rssi avg/max", (d.rssi_avg != null ? d.rssi_avg : "—") + " / " + (d.rssi_max != null ? d.rssi_max : "—")],
    ["packets", (d.packets || 0) + "  ·  itvl " + (d.itvl_ms || 0) + " ms  ·  dwell " + (d.dwell_ms || 0) + " ms"],
    ["boot/uptime", (d.boot_seq || 0) + " / " + (d.uptime_s || 0) + " s"]
  ];
  if (d.ibeacon) kv.push(["uuid", '<span class="mono">' + esc(fmtUuid(d.uuid)) + "</span>"], ["major/minor", d.major + " / " + d.minor]);
  let h = '<dl class="kv">' + kv.map(r => "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>").join("") + "</dl>";
  if (d.raw) h += '<div class="dim" style="font-size:11px;margin-top:8px">raw · ' + d.raw.length / 2 + " B" +
    '<button class="copy" data-copy="' + esc(d.raw) + '">' + t("copy") + "</button>" +
    '<div class="hex">' + esc(hexPairs(d.raw)) + "</div></div>";
  if (d.rsp) h += '<div class="dim" style="font-size:11px">rsp · ' + d.rsp.length / 2 + " B" +
    '<button class="copy" data-copy="' + esc(d.rsp) + '">' + t("copy") + "</button>" +
    '<div class="hex">' + esc(hexPairs(d.rsp)) + "</div></div>";
  if (d.mfg) h += '<div class="dim" style="font-size:11px">mfg · ' + esc(d.mfg_vendor || companyName(d.mfg_company || 0)) +
    (d.mfg_src ? " (from scan response)" : "") +
    '<button class="copy" data-copy="' + esc(d.mfg) + '">' + t("copy") + "</button>" +
    '<div class="hex">' + esc(hexPairs(d.mfg)) + "</div></div>";
  h += '<div class="row" style="margin-top:10px">';
  if (kind === "archive") h += '<button class="btn ok sm" data-act="pin">' + t("act_pin") + "</button>";
  else h += '<button class="btn bad sm" data-act="unpin">' + t("act_unpin") + "</button>";
  h += "</div>";
  return h;
}

async function recAction(act, d, i) {
  if (act === "pin") {
    /* the archive listing order is what /api/pins expects: the index in the unfiltered array */
    const idx = archive.indexOf(d);
    const r = await post("/api/pins", { index: idx >= 0 ? idx : i });
    toast(r.ok ? t("saved") : (r.err || t("err_failed")), !r.ok);
    if (r.ok) await loadPins();
  } else if (act === "unpin") {
    const r = await del("/api/pins/" + (d.id != null ? d.id : i));
    toast(r.ok ? t("deleted") : (r.err || t("err_failed")), !r.ok);
    if (r.ok) await loadPins();
    renderList();
  }
}

/* ------------------------------------------------------------------ profiles */
function renderProfiles(box) {
  if (!profiles.length) { box.innerHTML = '<div class="empty">' + esc(t("empty_profiles")) + "</div>"; return; }
  profiles.forEach(p => {
    const el = document.createElement("div");
    el.className = "rec";
    const isRaw = p.kind === 1;
    const len = isRaw ? ((p.raw || "").length / 2) : "";
    const sub = [isRaw ? t("kind_raw") : t("kind_ib"), isRaw ? len + " B" : fmtUuid(p.uuid),
                 p.adv_itvl_ms + " ms", p.radio_dbm + " dBm", p.enabled ? "" : t("off")].filter(Boolean).join(" · ");
    el.innerHTML = '<div class="h"><span class="rssi ' + (p.enabled ? "" : "mid") + '">#' + p.id + "</span>" +
      '<div class="t"><div class="n">' + esc(p.name) +
      (p.active ? ' <span class="tag ding">' + t("active") + "</span>" : "") +
      ' <span class="tag">' + esc(isRaw ? t("kind_raw") : t("kind_ib")) + "</span></div>" +
      '<div class="s mono">' + esc(sub) + "</div></div></div>" +
      '<div class="b" style="display:block">' +
      (isRaw && p.raw ? '<div class="dim" style="font-size:11px">raw · ' + len + " B" +
        '<button class="copy" data-copy="' + esc(p.raw) + '">' + t("copy") + "</button>" +
        '<div class="hex">' + esc(hexPairs(p.raw)) + "</div></div>" : "") +
      '<div class="row" style="margin-top:8px">' +
      '<button class="btn pri sm" data-pact="activate">' + t("act_activate") + "</button>" +
      '<button class="btn sm" data-pact="edit">' + t("act_edit") + "</button>" +
      '<button class="btn bad sm" data-pact="delete">' + t("act_delete") + "</button></div></div>";
    el.querySelectorAll("[data-copy]").forEach(b => {
      b.onclick = ev => { ev.stopPropagation(); navigator.clipboard && navigator.clipboard.writeText(b.dataset.copy); toast(t("copied")); };
    });
    el.querySelectorAll("[data-pact]").forEach(b => {
      b.onclick = ev => {
        ev.stopPropagation();
        const a = b.dataset.pact;
        if (a === "edit") { openDialog(p); return; }
        guard(async () => {
          if (a === "activate") {
            const r = await post("/api/active", { id: p.id });
            toast(r.ok ? t("saved") : (r.err || t("err_failed")), !r.ok);
            await refreshStatus(); await loadProfiles();
          } else {
            if (!confirm(t("confirm_del"))) return;
            const r = await del("/api/profiles/" + p.id);
            toast(r.ok ? t("deleted") : (r.err || t("err_failed")), !r.ok);
            await loadProfiles(); await refreshStatus();
          }
          renderList();
        });
      };
    });
    box.appendChild(el);
  });
}

let dlgKind = 1, dlgId = null;
function openDialog(p) {
  dlgId = p ? p.id : null;
  dlgKind = p ? p.kind : 1;
  $("dlg-title").textContent = p ? t("dlg_edit") : t("dlg_new");
  $("d-name").value = p ? p.name : "";
  $("d-raw").value = (p && p.kind === 1) ? (p.raw || "") : "";
  $("d-rsp").value = (p && p.rsp) ? p.rsp : "";
  $("d-uuid").value = p ? (p.uuid || "") : "";
  $("d-major").value = p ? p.major : 0;
  $("d-minor").value = p ? p.minor : 0;
  $("d-ref").value = p ? p.ref_rssi : -59;
  $("d-itvl").value = p ? p.adv_itvl_ms : 100;
  $("d-tx").value = p ? p.radio_dbm : 9;
  $("d-scannable").checked = p ? !!p.scannable : false;
  $("d-enabled").checked = p ? !!p.enabled : true;
  syncKind();
  $("dlg").classList.add("show");
}
function syncKind() {
  document.querySelectorAll("#d-kind button").forEach(b => b.classList.toggle("on", Number(b.dataset.kind) === dlgKind));
  $("d-rawbox").style.display = dlgKind === 1 ? "" : "none";
  $("d-ibox").style.display = dlgKind === 0 ? "" : "none";
}
document.querySelectorAll("#d-kind button").forEach(b => { b.onclick = () => { dlgKind = Number(b.dataset.kind); syncKind(); }; });
$("d-cancel").onclick = () => $("dlg").classList.remove("show");

function hexOk(s, min, max) {
  if (s === "") return min === 0;
  if (!/^[0-9a-fA-F]+$/.test(s) || s.length % 2) return false;
  const b = s.length / 2;
  return b >= min && b <= max;
}
$("d-save").onclick = () => guard(async () => {
  const name = $("d-name").value.trim();
  if (!name) { toast("name required", true); return; }
  const body = {
    name, kind: dlgKind,
    adv_itvl_ms: Number($("d-itvl").value) || 100,
    radio_dbm: Number($("d-tx").value),
    scannable: $("d-scannable").checked,
    enabled: $("d-enabled").checked
  };
  if (dlgKind === 1) {
    const raw = $("d-raw").value.trim(), rsp = $("d-rsp").value.trim();
    if (!hexOk(raw, 2, 31)) { toast(t("bad_hex"), true); return; }
    body.raw = raw;
    if (rsp) { if (!hexOk(rsp, 1, 31)) { toast(t("bad_hex"), true); return; } body.rsp = rsp; }
  } else {
    const uuid = $("d-uuid").value.trim().toLowerCase();
    if (!hexOk(uuid, 16, 16)) { toast(t("bad_uuid"), true); return; }
    body.uuid = uuid;
    body.major = Number($("d-major").value) || 0;
    body.minor = Number($("d-minor").value) || 0;
    body.ref_rssi = Number($("d-ref").value) || -59;
  }
  const r = dlgId == null ? await post("/api/profiles", body) : await put("/api/profiles/" + dlgId, body);
  if (!r.ok) { toast(r.err || t("err_failed"), true); return; }
  $("dlg").classList.remove("show");
  toast(t("saved"));
  await loadProfiles(); await refreshStatus(); renderList();
});
$("btn-new").onclick = () => openDialog(null);
$("btn-refresh").onclick = () => guard(loadData);
document.querySelectorAll(".chip").forEach(c => {
  c.onclick = () => {
    const f = c.dataset.filter;
    if (f === "ding") ui.fDing = !ui.fDing;
    if (f === "pub") ui.fPub = !ui.fPub;
    if (f === "full") ui.fFull = !ui.fFull;
    c.classList.toggle("on");
    renderList();
  };
});
$("kw").oninput = e => { ui.kw = e.target.value; renderList(); };
$("sort").onchange = e => { ui.sort = e.target.value; localStorage.setItem("bgw_sort", ui.sort); renderList(); };

/* ------------------------------------------------------------------ settings */
async function loadSettings() {
  await refreshStatus();
  if (!CFG.scan) await loadProfiles();
  const sc = CFG.scan || {}, ap = CFG.ap || {}, rot = CFG.rotation || {};
  $("s-itvl").value = sc.itvl_ms || 300;
  $("s-win").value = sc.win_ms || 60;
  $("s-dur").value = sc.duration_s || 120;
  $("s-duty").checked = !!sc.full_duty;
  $("s-filter").checked = !!sc.filter_noise;
  $("s-clear").checked = !!sc.clear_each_round;
  $("s-rot-on").checked = !!rot.enabled;
  $("s-rot-s").value = rot.seconds || 30;
  $("s-ssid").value = ap.ssid || "";
  $("maint-kv").innerHTML =
    "<dt>" + t("r_ver") + "</dt><dd>" + esc(S.ver || "—") + "</dd>" +
    "<dt>" + t("r_board") + "</dt><dd>" + esc(S.board || "—") + "</dd>" +
    "<dt>" + t("r_uptime") + "</dt><dd>" + esc(fmtDur(S.uptime_s)) + "</dd>" +
    "<dt>" + t("r_archive") + "</dt><dd>" + esc(S.storage || "—") + "</dd>";
}
$("save-scan").onclick = () => guard(async () => {
  const body = {
    itvl_ms: Number($("s-itvl").value), win_ms: Number($("s-win").value),
    duration_s: Number($("s-dur").value), full_duty: $("s-duty").checked,
    filter_noise: $("s-filter").checked, clear_each_round: $("s-clear").checked
  };
  const r = await post("/api/scan", body);
  toast(r.ok ? t("saved") : (r.err || t("err_failed")), !r.ok);
});
$("save-ap").onclick = () => guard(async () => {
  const r = await post("/api/ap", { ssid: $("s-ssid").value, pass: $("s-pass").value });
  toast(r.ok ? t("saved") : (r.err || t("err_failed")), !r.ok);
});
$("save-rot").onclick = () => guard(async () => {
  const r = await post("/api/rotation", { enabled: $("s-rot-on").checked, seconds: Number($("s-rot-s").value) });
  toast(r.ok ? t("saved") : (r.err || t("err_failed")), !r.ok);
});
$("btn-export").onclick = () => guard(async () => {
  const r = await get("/api/export");
  const blob = new Blob([JSON.stringify(r, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "beacon-gw-config.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(t("exported"));
});
$("btn-import").onclick = () => $("file-import").click();
$("file-import").onchange = e => guard(async () => {
  const f = e.target.files[0];
  if (!f) return;
  const txt = await f.text();
  let body;
  try { body = JSON.parse(txt); } catch (err) { toast("bad json", true); return; }
  const r = await post("/api/import", body);
  toast(r.ok ? t("imported") : (r.err || t("err_failed")), !r.ok);
  e.target.value = "";
});
$("btn-reboot").onclick = () => guard(async () => {
  if (!confirm(t("set_reboot") + "?")) return;
  await post("/api/reboot", {});
  toast("rebooting…");
});
$("btn-factory").onclick = () => guard(async () => {
  if (!confirm(t("confirm_factory"))) return;
  await post("/api/factory", {});
  toast("factory reset…");
});

/* ------------------------------------------------------------------ render */
function render() {
  if (ui.tab === "status") renderStatus();
  if (ui.tab === "data") renderList();
  if (ui.tab === "settings") { /* static fields already loaded */ }
  applyChips();
}
function applyChips() {
  document.querySelectorAll(".chip").forEach(c => {
    const f = c.dataset.filter;
    const on = f === "ding" ? ui.fDing : f === "pub" ? ui.fPub : ui.fFull;
    c.classList.toggle("on", on);
  });
  $("sort").value = ui.sort;
}

/* ------------------------------------------------------------------ boot */
let pollTimer = null;
async function boot() {
  await refreshStatus();
  await loadProfiles();
  applyLang();
  syncSubUI();
  setTab(ui.tab);
  if (!pollTimer) pollTimer = setInterval(() => { if (ui.tab === "status") refreshStatus(); }, 2000);
}
document.addEventListener("DOMContentLoaded", () => {
  if (ui.sub === "profiles") { $("tools").style.display = "none"; $("btn-new").style.display = ""; }
  if (token) { boot(); }
  else { applyLang(); showLogin(); }
});
</script>
</body>
</html>
